name: Onde assistir o Vasco

on:
  schedule:
    # Horários em UTC (o GitHub não aceita fuso). Brasília = UTC-3.
    - cron: "0 11 * * *"   # 08:00 BRT — sync
    - cron: "0 23 * * *"   # 20:00 BRT — sync
    # O lembrete roda três vezes porque o GitHub chega a atrasar o cron em horas; o
    # primeiro que rodar envia e os outros veem data/lembretes.json e não repetem.
    # Minuto 17 para fugir do pico de disparos na hora cheia.
    - cron: "17 6 * * *"   # 03:17 BRT — lembrete do dia
    - cron: "17 9 * * *"   # 06:17 BRT — lembrete (reserva)
    - cron: "17 12 * * *"  # 09:17 BRT — lembrete (reserva)
  workflow_dispatch:
    inputs:
      comando:
        description: "O que rodar"
        type: choice
        options: [sync, lembrete, testar]
        default: sync
      dry_run:
        description: "Só mostrar no log, sem enviar nem commitar"
        type: boolean
        default: true

# Um workflow só, e nunca dois runs ao mesmo tempo: os dois comandos escrevem em
# data/ e pushes concorrentes dariam conflito.
concurrency:
  group: vasco
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      # A ponta do branch, não o commit que existia quando o run foi criado: um
      # lembrete que ficou na fila atrás de outro precisa ver o lembretes.json que
      # esse outro acabou de commitar, senão manda a mensagem de novo.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decidir o comando
        id: alvo
        env:
          # Os crons do minuto 17 são os do lembrete; os outros dois sincronizam.
          CRON: ${{ github.event.schedule }}
          ENTRADA: ${{ inputs.comando }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ -n "$ENTRADA" ]; then
            comando="$ENTRADA"
            [ "$DRY" = "true" ] && flags="--dry-run" || flags=""
          else
            case "$CRON" in
              "17 "*) comando="lembrete" ;;
              *)      comando="sync" ;;
            esac
            flags=""
          fi
          echo "comando=$comando" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "Vai rodar: $comando $flags"

      - name: Rodar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONPATH: src
        run: python -m vascotv ${{ steps.alvo.outputs.comando }} ${{ steps.alvo.outputs.flags }}

      - name: Commitar o estado, se mudou
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "Nada mudou em data/; sem commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Atualiza calendário do Vasco [skip ci]"
          # Outro run pode ter commitado no meio do caminho.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
